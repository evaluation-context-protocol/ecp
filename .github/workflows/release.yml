name: Auto Release on PR Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main
  # Manual escape hatch. Without it, the only way to publish is to merge a PR
  # with the right title prefix - which is how 0.9.0 -> 0.10.0 sat unpublished
  # for two months behind five merges that all silently matched nothing.
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump to apply"
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  id-token: write

jobs:
  bump-and-publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # We need to fetch all history and tags to ensure we can push back
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine Bump Type
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP="${{ github.event.inputs.bump_type }}"
            echo "Manual release requested: $BUMP"
            echo "bump_type=$BUMP" >> $GITHUB_OUTPUT
            echo "### Manual release: \`$BUMP\` bump" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $TITLE"

          if [[ "$TITLE" == major:* ]]; then
            echo "bump_type=major" >> $GITHUB_OUTPUT
          elif [[ "$TITLE" == minor:* ]]; then
            echo "bump_type=minor" >> $GITHUB_OUTPUT
          elif [[ "$TITLE" == hotfix:* ]]; then
            echo "bump_type=patch" >> $GITHUB_OUTPUT
          else
            echo "bump_type=none" >> $GITHUB_OUTPUT
            # A warning annotation and a job summary, because a silently green
            # "release" job is indistinguishable from one that published.
            echo "::warning title=No release published::PR title [$TITLE] has no major:/minor:/hotfix: prefix, so no version bump, tag, or PyPI publish happened."
            {
              echo "### :warning: No release published"
              echo ""
              echo "PR title: \`$TITLE\`"
              echo ""
              echo "The release job only triggers on a title starting with \`major:\`, \`minor:\` or \`hotfix:\`."
              echo "Nothing was bumped, tagged, or published to PyPI."
              echo ""
              echo "To publish these changes, run the **Auto Release on PR Merge** workflow manually with a bump type."
            } >> $GITHUB_STEP_SUMMARY
          fi

      - name: Bump Versions
        id: bump
        if: steps.parse.outputs.bump_type != 'none'
        shell: python
        run: |
          import os
          import re
          from pathlib import Path
          
          bump_type = "${{ steps.parse.outputs.bump_type }}"
          
          # Read current version from runtime pyproject.toml
          runtime_toml_path = Path("runtime/python/pyproject.toml")
          content = runtime_toml_path.read_text(encoding="utf-8")
          match = re.search(r'version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', content)
          
          if not match:
              print("Could not find version in pyproject.toml!")
              exit(1)
              
          major, minor, patch = map(int, match.groups())
          
          if bump_type == "major":
              major += 1
              minor = 0
              patch = 0
          elif bump_type == "minor":
              minor += 1
              patch = 0
          elif bump_type == "patch":
              patch += 1
              
          new_version = f"{major}.{minor}.{patch}"
          print(f"Bumping version to {new_version}")
          
          # 1. Update runtime/python/pyproject.toml
          new_content = re.sub(
              r'(version\s*=\s*)"\d+\.\d+\.\d+"',
              f'\\g<1>"{new_version}"',
              content
          )
          runtime_toml_path.write_text(new_content, encoding="utf-8")
          
          # 2. Update sdk/python/pyproject.toml
          sdk_toml_path = Path("sdk/python/pyproject.toml")
          sdk_content = sdk_toml_path.read_text(encoding="utf-8")
          new_sdk_content = re.sub(
              r'(version\s*=\s*)"\d+\.\d+\.\d+"',
              f'\\g<1>"{new_version}"',
              sdk_content
          )
          sdk_toml_path.write_text(new_sdk_content, encoding="utf-8")
          
          # 3. Update runtime/python/src/ecp_runtime/__init__.py
          init_path = Path("runtime/python/src/ecp_runtime/__init__.py")
          init_content = init_path.read_text(encoding="utf-8")
          new_init_content = re.sub(
              r'(__version__\s*=\s*)"\d+\.\d+\.\d+"',
              f'\\g<1>"{new_version}"',
              init_content
          )
          init_path.write_text(new_init_content, encoding="utf-8")
          
          # 4. Update every doc that pins a version.
          # These drifted four releases behind when only runtime/README.md was
          # rewritten here, so users were told to install versions that predated
          # most of the features documented on the same page.
          doc_paths = [
              Path("runtime/python/README.md"),
              Path("sdk/python/README.md"),
              Path("README.md"),
              Path("docs/index.md"),
              Path("docs/quickstart.md"),
              Path("docs/ci.md"),
          ]
          doc_patterns = [
              # pip pins, including SDK extras: ecp-sdk[langchain]==X.Y.Z
              (r'(ecp-(?:runtime|sdk)(?:\[[a-z,]+\])?==)\d+\.\d+\.\d+', f'\\g<1>{new_version}'),
              # prose: "The current release line is `X.Y.Z`."
              (r'((?:release|package) line is `)\d+\.\d+\.\d+`', f'\\g<1>{new_version}`'),
          ]
          for doc_path in doc_paths:
              if not doc_path.exists():
                  print(f"Skipping missing {doc_path}")
                  continue
              doc_content = doc_path.read_text(encoding="utf-8")
              for pattern, replacement in doc_patterns:
                  doc_content = re.sub(pattern, replacement, doc_content)
              doc_path.write_text(doc_content, encoding="utf-8")
              print(f"Updated version pins in {doc_path}")

          # Output for next steps
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"new_version={new_version}\n")
              f.write(f"new_tag=v{new_version}\n")

      - name: Commit and Push Changes
        if: steps.parse.outputs.bump_type != 'none'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add runtime/python/pyproject.toml sdk/python/pyproject.toml runtime/python/src/ecp_runtime/__init__.py runtime/python/README.md sdk/python/README.md README.md docs/index.md docs/quickstart.md docs/ci.md
          
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          NEW_TAG="${{ steps.bump.outputs.new_tag }}"
          
          git commit -m "chore: bump version to $NEW_TAG"
          git tag $NEW_TAG
          git push origin main
          git push origin $NEW_TAG

      - name: Install test dependencies
        if: steps.parse.outputs.bump_type != 'none'
        run: pip install -e runtime/python

      - name: Run runtime tests
        if: steps.parse.outputs.bump_type != 'none'
        run: python -m unittest discover -s runtime/python/tests -p "test_*.py"

      - name: Run sdk tests
        if: steps.parse.outputs.bump_type != 'none'
        run: python -m unittest discover -s sdk/python/tests -p "test_*.py"

      - name: Run feature-agent spec tests
        if: steps.parse.outputs.bump_type != 'none'
        run: |
          if ls tests/test_*.py 1> /dev/null 2>&1; then
            python -m unittest discover -s tests -p "test_*.py"
          fi

      - name: Install build tool
        if: steps.parse.outputs.bump_type != 'none'
        run: python -m pip install --upgrade build

      - name: Build runtime package
        if: steps.parse.outputs.bump_type != 'none'
        run: |
          rm -rf runtime/python/dist
          python -m build runtime/python

      - name: Build sdk package
        if: steps.parse.outputs.bump_type != 'none'
        run: |
          rm -rf sdk/python/dist
          python -m build sdk/python

      - name: Create GitHub release
        if: steps.parse.outputs.bump_type != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          name: ${{ steps.bump.outputs.new_tag }}
          prerelease: false
          files: |
            runtime/python/dist/*
            sdk/python/dist/*

      - name: Publish runtime to PyPI
        if: steps.parse.outputs.bump_type != 'none'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: runtime/python/dist

      - name: Publish sdk to PyPI
        if: steps.parse.outputs.bump_type != 'none'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
