[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecp-runtime"
version = "0.10.0"
description = "Vendor-neutral runtime for portable AI agent evaluations with outputs, tool calls, and audit context."
authors = [
  { name = "ECP Maintainers", email = "aniket.wattamwar17@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",         # For the CLI
    "pyyaml>=6.0",          # For reading Manifests
    "pydantic>=2.0",        # For validating Schemas
    "rich>=13.0",           # For pretty terminal output
  "Jinja2>=3.1.0",        # For HTML report rendering
]

[project.optional-dependencies]
# The llm_judge grader is the only thing that needs litellm, and it is a heavy
# transitive tree. Keeping it optional means `pip install ecp-runtime` stays
# light and our version pin stops being imposed on every user.
judge = ["litellm>=1.0.0,<1.50.0"]

[project.urls]
Homepage = "https://github.com/evaluation-context-protocol/ecp"
Documentation = "https://evaluationcontextprotocol.io/"
Repository = "https://github.com/evaluation-context-protocol/ecp"
Issues = "https://github.com/evaluation-context-protocol/ecp/issues"

[project.scripts]
ecp = "ecp_runtime.cli:app" 

[project.entry-points.pytest11]
ecp_runtime = "ecp_runtime.pytest_plugin"


